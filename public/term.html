<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZWFR0B14JX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZWFR0B14JX");
    </script>
    <title>Terminal: Mail Agent</title>
    <meta name="description" content="Mail Agent in a terminal. Create an inbox, wait for mail, read the OTP or magic link. Works for people and for agents driving a browser." />
    <link rel="icon" href="/favicon.svg?v=20261110-logo-at" type="image/svg+xml" />
    <meta name="theme-color" content="#000000" />
    <style>
      :root {
        --bg: #000;
        --fg: #d6d6d6;
        --dim: #6e6e6e;
        --hi: #fff;
        --ok: #7ee787;
        --info: #79c0ff;
        --val: #ffa657;
        --err: #ff7b72;
        --line: rgba(255, 255, 255, 0.1);
        --mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body { font: 14px/1.6 var(--mono); display: flex; flex-direction: column; }
      a { color: var(--info); }
      .bar {
        display: flex; justify-content: space-between; gap: 12px;
        padding: 10px max(16px, calc((100% - 860px) / 2)); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px;
      }
      .bar a { color: var(--dim); text-decoration: none; }
      .bar a:hover { color: var(--hi); }
      .bar nav { display: flex; gap: 14px; }
      #screen { flex: 1; overflow-y: auto; padding: 16px; }
      .wrap { max-width: 860px; margin: 0 auto; }
      #out { white-space: pre-wrap; word-break: break-word; margin: 0; font: inherit; }
      #out .line { min-height: 1.6em; }
      .dim { color: var(--dim); } .hi { color: var(--hi); } .ok { color: var(--ok); }
      .info { color: var(--info); } .val { color: var(--val); } .err { color: var(--err); }
      .big { color: var(--val); font-size: 28px; letter-spacing: 0.08em; line-height: 1.4; }
      .prompt-row { display: flex; align-items: baseline; gap: 8px; }
      .prompt-row .ps { color: var(--ok); flex: none; }
      #cmd {
        flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; padding: 0;
        color: var(--hi); font: inherit; caret-color: var(--hi);
      }
      .keys {
        display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 14px;
        border-top: 1px solid var(--line);
      }
      .keys .wrap { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
      .keys button {
        background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 6px;
        font: 12px/1 var(--mono); padding: 8px 10px; cursor: pointer;
      }
      .keys button:hover, .keys button:focus-visible { color: var(--hi); border-color: var(--dim); outline: 0; }
      .copy { cursor: pointer; text-decoration: underline dotted var(--dim); text-underline-offset: 3px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @media (max-width: 560px) {
        body { font-size: 13px; }
        .bar nav a.opt { display: none; }
        .big { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a href="/">mail agent</a>
      <nav>
        <a href="/get-key.html">get key</a>
        <a class="opt" href="/docs/agents.html">docs</a>
        <a class="opt" href="/dashboard.html">console</a>
      </nav>
    </header>

    <main id="screen" data-api="https://api.webmailagent.com">
      <div class="wrap">
        <h1 class="sr">Mail Agent terminal</h1>
        <div id="out" role="log" aria-live="polite"></div>
        <form class="prompt-row" id="form" autocomplete="off">
          <label class="ps" for="cmd">$</label>
          <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-label="Command" />
        </form>
        <noscript><p>This page needs JavaScript. The same API works over HTTP: <a href="/docs/agents.html">agent docs</a>.</p></noscript>
      </div>
    </main>

    <div class="keys" aria-label="Quick commands">
      <div class="wrap">
        <button type="button" data-cmd="new">new</button>
        <button type="button" data-cmd="wait">wait</button>
        <button type="button" data-cmd="read">read</button>
        <button type="button" data-cmd="ls">ls</button>
        <button type="button" data-cmd="sim otp">sim otp</button>
        <button type="button" data-cmd="help">help</button>
      </div>
    </div>

    <script src="/term.js?v=20261110-term-6" defer></script>
  </body>
</html>
