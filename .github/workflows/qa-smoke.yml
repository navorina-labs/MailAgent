# Smoke QA on feature branches (no Worker deploy)
name: QA Smoke

on:
  push:
    branches:
      - "qa/**"
  pull_request:
    branches: [main]

jobs:
  check-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:api-path
      - run: npm run test:auth-error
      - run: npm run test:pilot-request
      - run: npm run test:key-signup
      - run: npm run test:billing
      - run: npm run test:product-analytics
      - run: npm run test:term
      - run: npm run build:qa
      - run: npm run verify:codex

      - name: Smoke prod gate (light — saves KV quota)
        env:
          MAILAGENT_API_URL: https://api.webmailagent.com
          MAILAGENT_API_KEY: ${{ secrets.MAILAGENT_API_KEY }}
        run: |
          if [ -z "$MAILAGENT_API_KEY" ]; then
            echo "::error::Set MAILAGENT_API_KEY in GitHub Actions secrets — see docs/OPERATOR.md"
            exit 1
          fi
          npm run test:prod:gate
          npm run test:qa-pilot-starter
          npm run test:qa-pilot-cypress-starter
